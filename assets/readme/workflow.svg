<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="332" viewBox="0 0 1200 332" role="img" aria-labelledby="title desc"><title id="title">WebGPT Consult workflow</title><desc id="desc">Local judgment, evidence assembly, preflight, verified Web consultation, result binding, and local adoption.</desc><rect width="1200" height="332" rx="28" fill="#F6F8FC"/><text x="56" y="62" fill="#10182B" font-size="34" font-weight="760" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">A narrow, verifiable review path</text><text x="56" y="96" fill="#64718A" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">LOCAL → EVIDENCE → PREFLIGHT → WEB REVIEW → VERIFY → ADOPT</text><g transform="translate(56 140)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"><g><rect width="158" height="118" rx="20" fill="#FFFFFF" stroke="#D7DDEA"/><text x="22" y="35" fill="#6677FF" font-size="15" font-weight="750">01</text><text x="22" y="68" fill="#14203A" font-size="20" font-weight="720">Local</text><text x="22" y="94" fill="#66758D" font-size="14">form judgment</text></g><path d="M168 59H193" stroke="#8C9BC0" stroke-width="2.5"/><path d="M186 52L195 59L186 66" fill="none" stroke="#8C9BC0" stroke-width="2.5"/><g transform="translate(204)"><rect width="158" height="118" rx="20" fill="#FFFFFF" stroke="#D7DDEA"/><text x="22" y="35" fill="#6677FF" font-size="15" font-weight="750">02</text><text x="22" y="68" fill="#14203A" font-size="20" font-weight="720">Evidence</text><text x="22" y="94" fill="#66758D" font-size="14">smallest truthful set</text></g><path d="M372 59H397" stroke="#8C9BC0" stroke-width="2.5"/><path d="M390 52L399 59L390 66" fill="none" stroke="#8C9BC0" stroke-width="2.5"/><g transform="translate(408)"><rect width="158" height="118" rx="20" fill="#FFFFFF" stroke="#D7DDEA"/><text x="22" y="35" fill="#6677FF" font-size="15" font-weight="750">03</text><text x="22" y="68" fill="#14203A" font-size="20" font-weight="720">Preflight</text><text x="22" y="94" fill="#66758D" font-size="14">scan + bind payload</text></g><path d="M576 59H601" stroke="#8C9BC0" stroke-width="2.5"/><path d="M594 52L603 59L594 66" fill="none" stroke="#8C9BC0" stroke-width="2.5"/><g transform="translate(612)"><rect width="158" height="118" rx="20" fill="#101B31" stroke="#354A71"/><text x="22" y="35" fill="#54E1C1" font-size="15" font-weight="750">04</text><text x="22" y="68" fill="#FFFFFF" font-size="20" font-weight="720">Sol review</text><text x="22" y="94" fill="#A7B7D4" font-size="14">Pro, then High</text></g><path d="M780 59H805" stroke="#8C9BC0" stroke-width="2.5"/><path d="M798 52L807 59L798 66" fill="none" stroke="#8C9BC0" stroke-width="2.5"/><g transform="translate(816)"><rect width="158" height="118" rx="20" fill="#FFFFFF" stroke="#D7DDEA"/><text x="22" y="35" fill="#6677FF" font-size="15" font-weight="750">05</text><text x="22" y="68" fill="#14203A" font-size="20" font-weight="720">Verify</text><text x="22" y="94" fill="#66758D" font-size="14">sentinel + task ID</text></g><path d="M984 59H1009" stroke="#8C9BC0" stroke-width="2.5"/><path d="M1002 52L1011 59L1002 66" fill="none" stroke="#8C9BC0" stroke-width="2.5"/><g transform="translate(1020)"><rect width="124" height="118" rx="20" fill="#FFFFFF" stroke="#D7DDEA"/><text x="20" y="35" fill="#C074FF" font-size="15" font-weight="750">06</text><text x="20" y="68" fill="#14203A" font-size="20" font-weight="720">Adopt</text><text x="20" y="94" fill="#66758D" font-size="14">decide locally</text></g></g></svg>