<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7b2ff7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bubble" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="64" x2="256" y2="64" stroke="white" stroke-width="1"/>
    <line x1="0" y1="128" x2="256" y2="128" stroke="white" stroke-width="1"/>
    <line x1="0" y1="192" x2="256" y2="192" stroke="white" stroke-width="1"/>
    <line x1="64" y1="0" x2="64" y2="256" stroke="white" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="256" stroke="white" stroke-width="1"/>
    <line x1="192" y1="0" x2="192" y2="256" stroke="white" stroke-width="1"/>
  </g>

  <!-- Main chat bubble -->
  <g filter="url(#shadow)">
    <path d="M60 80 C60 65, 75 55, 90 55 L166 55 C181 55, 196 65, 196 80 L196 130 C196 145, 181 155, 166 155 L120 155 L95 180 L95 155 L90 155 C75 155, 60 145, 60 130 Z"
          fill="url(#bubble)" stroke="url(#accent)" stroke-width="2"/>

    <!-- Inner content lines -->
    <rect x="85" y="85" width="86" height="8" rx="4" fill="#e0e0e0"/>
    <rect x="85" y="100" width="70" height="8" rx="4" fill="#e0e0e0"/>
    <rect x="85" y="115" width="55" height="8" rx="4" fill="#e0e0e0"/>
  </g>

  <!-- Question mark with glow -->
  <g filter="url(#glow)">
    <text x="128" y="105" font-family="Inter, -apple-system, sans-serif" font-size="48" font-weight="300" fill="url(#accent)" text-anchor="middle" dominant-baseline="middle" opacity="0.9">?</text>
  </g>

  <!-- Second opinion arrow (smaller, bottom right) -->
  <g transform="translate(170, 175) rotate(45)">
    <line x1="0" y1="20" x2="0" y2="0" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="15" y2="0" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <polyline points="12,-4 20,0 12,4" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="60" cy="60" r="3" fill="url(#accent)" opacity="0.4"/>
  <circle cx="196" cy="60" r="3" fill="url(#accent)" opacity="0.4"/>
  <circle cx="60" cy="196" r="3" fill="url(#accent)" opacity="0.4"/>
  <circle cx="196" cy="196" r="3" fill="url(#accent)" opacity="0.4"/>
</svg>
